
name: test

on: [ push, pull_request ]

permissions:
  contents: read

jobs:

  test-ubuntu:

    if: " ! (contains(github.event.head_commit.message, 'skip ci') || contains(github.event.head_commit.message, 'ci skip'))"

    name: ${{matrix.ruby}} on ${{matrix.os}} in ${{matrix.tz}}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        ruby: [
          '2.7',
          '3.1', '3.2', '3.3', '3.4',
          '4.0',
          'jruby-9', 'jruby-10',
          'truffleruby' ]
        experimental: [ false ]
        tz: [ '', 'UTC', 'Asia/Tokyo', 'America/Chicago' ]
      fail-fast: false
    runs-on: ${{matrix.os}}
    continue-on-error: ${{matrix.experimental}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{matrix.ruby}}
          bundler-cache: true
      - run: ruby --version
      - run: gem --version
      - run: bundle --version
      - run: bundle exec proba --no-color
        env:
          TZ: ${{matrix.tz}}

  test-windows:

    if: " ! (contains(github.event.head_commit.message, 'skip ci') || contains(github.event.head_commit.message, 'ci skip'))"

    name: ${{matrix.ruby}} on ${{matrix.os}} in ${{matrix.tz}}

    strategy:
      matrix:
        os: [ 'windows-2022' ]
        #ruby: [ '2.5', '2.6', '2.7', '3.0', jruby-9.3 ]
        ruby: [ '2.7', '3.1', '3.4', '4.0' ]
        experimental: [ false ]
        tz: [ 'UTC', 'Tokyo Standard Time', 'Eastern Standard Time' ]
      fail-fast: false
    runs-on: ${{matrix.os}}
    continue-on-error: ${{matrix.experimental}}

    env:
      TZONE: ${{matrix.tz}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{matrix.ruby}}
          bundler-cache: true
      - run: tzutil /s "%TZONE%"
        shell: cmd
      - run: echo %date% %time%; tzutil /g
        shell: cmd
      - run: ruby --version
      - run: gem --version
      - run: bundle --version
      - run: cp Gemfile.windows Gemfile
      - run: bundle install # since the Gemfile changed...
      - run: ruby -e "n = Time.now; p [ ENV['TZ'], n, n.zone ]"
      - run: bundle exec ruby -e "require 'et-orbi'; p EtOrbi.determine_local_tzone"
      - run: bundle exec proba --no-color

